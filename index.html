<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>Lente</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#000; --panel:#17181b; --panel2:#24262b; --fg:#f5f5f6; --mut:#a8a8b2;
  --acc:#ffd60a; --line:#33353b; --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:16px/1.3 system-ui,Roboto,"Segoe UI",sans-serif;overflow:hidden;
  overscroll-behavior:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}

#app{position:fixed;inset:0}

/* ---- Palco immagine ---- */
#stage{position:absolute;inset:0;overflow:hidden;background:#000;isolation:isolate;touch-action:none;min-height:0}
.layer{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;
  transform-origin:50% 50%;will-change:transform,filter;background:#000}
#frozen{display:none}
#tint{position:absolute;inset:0;mix-blend-mode:multiply;pointer-events:none;display:none}
.badges{position:absolute;left:calc(12px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top));display:flex;gap:8px;z-index:5;pointer-events:none;flex-wrap:wrap}
.badge{background:rgba(0,0,0,.72);color:var(--fg);border:1px solid rgba(255,255,255,.25);
  padding:6px 14px;border-radius:999px;font-weight:700;font-size:20px;letter-spacing:.2px;
  font-variant-numeric:tabular-nums}
.badge.recb{display:none;background:#e5372b;border-color:#e5372b;color:#fff;font-size:16px;align-items:center;gap:8px}
.badge.recb i{width:10px;height:10px;border-radius:50%;background:#fff;animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:.15}}
.badge.lock{color:#000;background:var(--acc);border-color:var(--acc);font-size:14px;display:none;align-items:center}
#ring{position:absolute;z-index:4;width:76px;height:76px;margin:-38px 0 0 -38px;border:3px solid var(--acc);
  border-radius:50%;pointer-events:none;opacity:0;box-shadow:0 0 0 1px rgba(0,0,0,.6),inset 0 0 0 1px rgba(0,0,0,.6)}
#ring.go{animation:ring 1.1s ease-out}
@keyframes ring{0%{opacity:1;transform:scale(1.7)}25%{opacity:1;transform:scale(1)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
#hint,#toast{position:absolute;left:50%;transform:translateX(-50%);z-index:6;
  background:rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.25);border-radius:14px;
  padding:10px 16px;text-align:center;width:max-content;max-width:calc(100% - 24px);pointer-events:none;
  opacity:0;transition:opacity .25s}
#hint{bottom:calc(160px + env(safe-area-inset-bottom))}
#toast{top:calc(68px + env(safe-area-inset-top))}#hint.show,#toast.show{opacity:1}

#msg{position:absolute;inset:0;z-index:8;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;padding:28px;text-align:center;background:#0c0c0e}
#msg h2{margin:0;font-size:22px}
#msg p{margin:0;color:var(--mut);max-width:34ch}
#msg button{background:var(--acc);color:#000;border:0;border-radius:14px;padding:14px 26px;font-weight:700;font-size:18px}

/* ---- Pannello comandi ---- */
#panel{position:absolute;z-index:7;left:50%;transform:translateX(-50%);
  bottom:calc(8px + env(safe-area-inset-bottom));width:min(calc(100% - 16px),580px);
  max-height:calc(100% - 90px);overflow-y:auto;
  background:rgba(23,24,27,.84);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:22px;padding:8px 10px 10px;
  display:flex;flex-direction:column;gap:8px;touch-action:manipulation}
#panel.off{display:none}
.fab{position:absolute;z-index:9;right:calc(12px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top));
  width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.3);
  background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center}
.fab svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fab[aria-pressed=true]{background:var(--acc);border-color:var(--acc)}
.fab[aria-pressed=true] svg{stroke:#000}
.zrow{display:flex;align-items:center;gap:8px}
.rb{flex:none;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);
  background:var(--panel2);font-size:30px;line-height:1;font-weight:500}
.rb:active{background:#34373e}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:44px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:#3b3d44}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;
  background:var(--acc);margin-top:-13px;border:3px solid #000;box-shadow:0 0 0 1px var(--acc)}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:#3b3d44}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--acc);border:3px solid #000}

.chips{display:flex;gap:8px;flex-wrap:wrap;padding:2px 0}
.chip{flex:none;border:1px solid var(--line);background:var(--panel2);border-radius:999px;
  padding:10px 16px;font-size:15px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:8px}
.chip i{width:18px;height:18px;border-radius:50%;border:1px solid #888;display:inline-block}
.chip[aria-pressed=true]{background:var(--acc);color:#000;border-color:var(--acc)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(48px,1fr));gap:6px}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  min-height:56px;padding:6px 1px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--panel2);font-size:11px;font-weight:600}
.btn svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn:active{background:#34373e}
.btn[aria-pressed=true]{background:var(--acc);color:#000;border-color:var(--acc)}
.btn[hidden]{display:none}
.btn.rec{background:#e5372b;border-color:#e5372b;color:#fff}
#media{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-bottom:8px}
#media[hidden]{display:none}
#mThumb{flex:none;width:48px;height:48px;border-radius:10px;overflow:hidden;padding:0;border:1px solid var(--line);background:#000;position:relative}
#mThumb img{width:100%;height:100%;object-fit:cover;display:block}
#mThumb .play{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35)}
#mThumb .play svg{width:22px;height:22px;fill:#fff}
#mThumb.vid .play{display:flex}
.mtxt{flex:1;min-width:0;display:flex;flex-direction:column}
.mtxt b{font-size:14px}.mtxt span{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);
  display:flex;align-items:center;justify-content:center;padding:0}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ib.primary{background:var(--acc);border-color:var(--acc);color:#000}
.ib[hidden]{display:none}
.sw{width:28px;height:28px;accent-color:var(--acc);margin:0}
#preview{position:fixed;inset:0;z-index:20;background:#000;display:none;align-items:center;justify-content:center}
#preview.open{display:flex}
#preview img,#preview video{max-width:100%;max-height:100%;object-fit:contain}
#pvClose{position:absolute;right:calc(12px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top));z-index:2}

#adjust{display:none;flex-direction:column;gap:8px;border-bottom:1px solid var(--line);padding-bottom:8px}
#adjust.open{display:flex}
.arow{display:flex;align-items:center;gap:10px}
.arow label{width:78px;font-size:14px;color:var(--mut)}
.arow output{width:44px;text-align:right;font-variant-numeric:tabular-nums;font-size:14px;color:var(--mut)}
#reset{align-self:flex-end;background:none;border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14px}

/* ---- Schermi bassi (orizzontale): barra ancora più compatta ---- */
@media (max-height:480px){
  .btn span{display:none}.btn{min-height:46px}
  .rb{width:42px;height:42px;font-size:26px}
  #hint{bottom:calc(136px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <video id="video" class="layer" playsinline muted autoplay></video>
    <canvas id="frozen" class="layer"></canvas>
    <div id="tint"></div>
    <div id="ring"></div>
    <div class="badges"><div class="badge" id="zval">×1.0</div><div class="badge lock" id="lockb">FERMO</div><div class="badge recb" id="recb"><i></i><span id="recT">0:00</span></div></div>
    <div id="toast" role="status"></div>
    <div id="hint">Tocca per mettere a fuoco · pizzica per ingrandire · trascina per spostare</div>
    <div id="msg">
      <h2 id="msgT">Fotocamera</h2>
      <p id="msgP"></p>
      <button id="retry">Attiva fotocamera</button>
    </div>
  </div>

  <button class="fab" id="bHide" aria-pressed="false" aria-label="Nascondi i comandi">
    <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>

  <button class="fab" id="bInstall" hidden aria-label="Installa l'app sul telefono" style="right:calc(76px + env(safe-area-inset-right));width:auto;padding:0 18px;border-radius:26px;background:var(--acc);border-color:var(--acc);color:#000;font-weight:700;font-size:15px">Installa</button>

  <div id="preview" role="dialog" aria-label="Anteprima">
    <div id="pvBody"></div>
    <button class="fab" id="pvClose" aria-label="Chiudi anteprima"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>

  <aside id="panel">
    <div id="media" hidden>
      <button id="mThumb" aria-label="Apri anteprima"><img id="mImg" alt=""><span class="play"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg></span></button>
      <div class="mtxt"><b id="mT">Foto</b><span id="mS"></span></div>
      <button class="ib primary" id="mShare" aria-label="Condividi" hidden>
        <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.3 10.8l7.4-4.4M8.3 13.2l7.4 4.4"/></svg></button>
      <button class="ib" id="mSave" aria-label="Salva sul telefono">
        <svg viewBox="0 0 24 24"><path d="M12 4v10"/><path d="M8 10l4 4 4-4"/><path d="M5 19h14"/></svg></button>
      <button class="ib" id="mClose" aria-label="Chiudi">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="adjust">
      <div class="chips" id="chips" role="group" aria-label="Filtro colore"></div>
      <div class="arow"><label for="bri">Luminosità</label><input id="bri" type="range" min="50" max="200" value="100"><output id="briV">100%</output></div>
      <div class="arow"><label for="aud" style="width:auto;flex:1">Registra anche l’audio nei video</label><input id="aud" class="sw" type="checkbox"></div>
      <div class="arow"><label for="con">Contrasto</label><input id="con" type="range" min="50" max="300" value="100"><output id="conV">100%</output></div>
      <button id="reset">Ripristina</button>
    </div>

    <div class="zrow">
      <button class="rb" id="zout" aria-label="Riduci zoom">−</button>
      <input id="zoom" type="range" min="0" max="1000" value="0" aria-label="Zoom">
      <button class="rb" id="zin" aria-label="Aumenta zoom">+</button>
    </div>

    <div class="grid">
      <button class="btn" id="bFreeze" aria-pressed="false">
        <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><span>Blocca</span></button>
      <button class="btn" id="bTorch" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24"><path d="M9 3h6l-1 5h-4z"/><path d="M10 8v3l-2 2v8h8v-8l-2-2V8"/><path d="M12 14v3"/></svg><span>Luce</span></button>
      <button class="btn" id="bCam" hidden>
        <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.5-5.8L20 8.5"/><path d="M20 4v4.5h-4.5"/><path d="M20 12a8 8 0 0 1-13.5 5.8L4 15.5"/><path d="M4 20v-4.5h4.5"/></svg><span id="camL">Cam</span></button>
      <button class="btn" id="bSnap">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/></svg><span>Foto</span></button>
      <button class="btn" id="bVid" aria-pressed="false">
        <svg viewBox="0 0 24 24"><rect x="3" y="6.5" width="12" height="11" rx="2.2"/><path d="M15 10.5l6-3.2v9.4l-6-3.2z"/></svg><span>Video</span></button>
      <button class="btn" id="bAdj" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h14"/><circle cx="9" cy="6" r="2" fill="#17181b"/><circle cx="15" cy="12" r="2" fill="#17181b"/><circle cx="8" cy="18" r="2" fill="#17181b"/></svg><span>Filtri</span></button>
    </div>
  </aside>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const stage = $('#stage'), video = $('#video'), frozen = $('#frozen'), tint = $('#tint');
const slider = $('#zoom'), zval = $('#zval'), lockb = $('#lockb');
const bFreeze = $('#bFreeze'), bTorch = $('#bTorch'), bCam = $('#bCam'), bSnap = $('#bSnap'), bAdj = $('#bAdj');

const MODES = {
  normal: { label: 'Colori',          f: '',                                        t: null,      dot: 'linear-gradient(135deg,#e33,#3b3,#33e)' },
  bw:     { label: 'Bianco e nero',   f: 'grayscale(1) contrast(1.8)',              t: null,      dot: 'linear-gradient(90deg,#000 50%,#fff 50%)' },
  neg:    { label: 'Bianco su nero',  f: 'invert(1) grayscale(1) contrast(1.5)',    t: null,      dot: 'linear-gradient(90deg,#fff 50%,#000 50%)' },
  ynb:    { label: 'Giallo su nero',  f: 'invert(1) grayscale(1) contrast(1.5)',    t: '#ffd60a', dot: 'linear-gradient(90deg,#ffd60a 50%,#000 50%)' },
  byn:    { label: 'Nero su giallo',  f: 'grayscale(1) contrast(1.8)',              t: '#ffd60a', dot: 'linear-gradient(90deg,#000 50%,#ffd60a 50%)' },
};

// ---- stato ----
let stream = null, track = null, caps = {};
let devices = [], devIdx = 0;
let hw = false, hwMin = 1, hwMax = 1, hwCur = 1, hasTorch = false, focusCont = false;
let Z = 1, panX = 0, panY = 0, D = 1;
let isFrozen = false, torchOn = false;
let poi = null, focusT = null, focusWarned = false, tap = null;
let mode = 'normal', bright = 1, contrast = 1, audioOn = false;
let rec = null, recBusy = false, last = null;

// ---- impostazioni salvate (opzionali) ----
try {
  const s = JSON.parse(localStorage.getItem('lente') || '{}');
  if (MODES[s.mode]) mode = s.mode;
  if (s.bright >= .5 && s.bright <= 2) bright = s.bright;
  if (s.contrast >= .5 && s.contrast <= 3) contrast = s.contrast;
  if (s.audio === true) audioOn = true;
} catch (e) {}
const save = () => { try { localStorage.setItem('lente', JSON.stringify({ mode, bright, contrast, audio: audioOn })); } catch (e) {} };

// ---- utilità UI ----
let toastT;
function toast(t, ms = 2200) {
  const el = $('#toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), ms);
}
function showMsg(title, text, btn = 'Riprova') {
  $('#msgT').textContent = title; $('#msgP').textContent = text; $('#retry').textContent = btn;
  $('#msg').style.display = 'flex';
}
const hideMsg = () => { $('#msg').style.display = 'none'; };

// ---- filtri ----
function filterString() {
  return `brightness(${bright}) contrast(${contrast}) ${MODES[mode].f}`.trim();
}
function applyFilter() {
  const f = filterString();
  video.style.filter = f; frozen.style.filter = f;
  const t = MODES[mode].t;
  tint.style.display = t ? 'block' : 'none';
  if (t) tint.style.background = t;
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.m === mode));
  $('#bri').value = Math.round(bright * 100); $('#briV').textContent = Math.round(bright * 100) + '%';
  $('#con').value = Math.round(contrast * 100); $('#conV').textContent = Math.round(contrast * 100) + '%';
}
const chips = $('#chips');
for (const [k, m] of Object.entries(MODES)) {
  const b = document.createElement('button');
  b.className = 'chip'; b.dataset.m = k; b.setAttribute('aria-pressed', 'false');
  b.innerHTML = `<i style="background:${m.dot}"></i>${m.label}`;
  b.onclick = () => { mode = k; applyFilter(); save(); };
  chips.appendChild(b);
}
$('#bri').oninput = e => { bright = e.target.value / 100; applyFilter(); save(); };
$('#con').oninput = e => { contrast = e.target.value / 100; applyFilter(); save(); };
$('#aud').checked = audioOn;
$('#aud').onchange = e => { audioOn = e.target.checked; save(); };
$('#reset').onclick = () => { bright = 1; contrast = 1; applyFilter(); save(); };
bAdj.onclick = () => {
  const open = $('#adjust').classList.toggle('open');
  bAdj.setAttribute('aria-pressed', open);
};
// nascondi / mostra i comandi: immagine a tutto schermo
$('#bHide').onclick = () => {
  const off = $('#panel').classList.toggle('off');
  $('#bHide').setAttribute('aria-pressed', off);
  $('#bHide').setAttribute('aria-label', off ? 'Mostra i comandi' : 'Nascondi i comandi');
};

// ---- zoom ----
const lo = () => hw ? hwMin : 1;
const hi = () => hw ? Math.min(hwMax * 3, 40) : 8;
const activeLayer = () => isFrozen ? frozen : video;

let busy = false, dirty = false, zHw = 1;
async function applyCons() {
  const a = {};
  if (hw) a.zoom = zHw;
  if (hasTorch) a.torch = torchOn;
  if (focusCont) a.focusMode = 'continuous';
  const sets = [];
  if (Object.keys(a).length) sets.push(a);
  if (poi) sets.push({ pointsOfInterest: [poi] });   // insieme separato: se non supportato, non blocca zoom e torcia
  if (sets.length) await track.applyConstraints({ advanced: sets });
}
async function pushHw() {
  if (!track) return;
  if (busy) { dirty = true; return; }
  busy = true;
  do { dirty = false; try { await applyCons(); } catch (e) {} } while (dirty);
  busy = false;
}

function setZoom(z) {
  const l = isFrozen ? hwCur : lo();
  Z = Math.min(hi(), Math.max(l, z));
  sync();
}
function sync() {
  const L = lo(), H = hi();
  slider.value = Math.round(1000 * Math.log(Z / L) / Math.log(H / L));
  zval.textContent = '×' + (Z < 10 ? Z.toFixed(1) : Math.round(Z));
  let base = 1;
  if (isFrozen) base = hwCur;
  else if (hw) { base = Math.min(Math.max(Z, hwMin), hwMax); if (Math.abs(base - zHw) > 0.005) { zHw = base; pushHw(); } }
  D = Math.max(1, Z / base);
  clampPan(); transform();
}
function clampPan() {
  const mx = (D - 1) * stage.clientWidth / 2, my = (D - 1) * stage.clientHeight / 2;
  panX = Math.min(mx, Math.max(-mx, panX)); panY = Math.min(my, Math.max(-my, panY));
}
function transform() {
  const t = `translate(${panX}px,${panY}px) scale(${D})`;
  video.style.transform = t; frozen.style.transform = t;
}
slider.oninput = () => {
  const L = lo(), H = hi();
  setZoom(L * Math.pow(H / L, slider.value / 1000));
};
$('#zin').onclick = () => setZoom(Z * 1.25);
$('#zout').onclick = () => setZoom(Z / 1.25);

// ---- gesti: pizzica = zoom, trascina = sposta ----
const ptrs = new Map();
let d0 = 0, z0 = 1;
const pdist = () => { const [a, b] = [...ptrs.values()]; return Math.hypot(a.x - b.x, a.y - b.y) || 1; };
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('#msg')) return;
  stage.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) tap = { x: e.clientX, y: e.clientY, t: performance.now(), moved: false };
  else if (tap) tap.moved = true;
  if (ptrs.size === 2) { d0 = pdist(); z0 = Z; }
  hideHint();
});
stage.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (tap && Math.hypot(e.clientX - tap.x, e.clientY - tap.y) > 12) tap.moved = true;
  if (ptrs.size >= 2) setZoom(z0 * pdist() / d0);
  else if (D > 1.001) { panX += dx; panY += dy; clampPan(); transform(); }
});
const up = e => {
  const wasOne = ptrs.size === 1;
  ptrs.delete(e.pointerId);
  if (e.type === 'pointerup' && wasOne && tap && !tap.moved && performance.now() - tap.t < 600) focusAt(e.clientX, e.clientY);
  if (!ptrs.size) tap = null;
};

// ---- tocca per mettere a fuoco ----
function showRing(x, y) {
  const r = $('#ring');
  r.style.left = x + 'px'; r.style.top = y + 'px';
  r.classList.remove('go'); void r.offsetWidth; r.classList.add('go');
}
function focusAt(cx, cy) {
  const rc = stage.getBoundingClientRect();
  const x = cx - rc.left, y = cy - rc.top;
  showRing(x, y);
  if (isFrozen || !track) return;
  const sw = video.videoWidth, sh = video.videoHeight; if (!sw) return;
  const W = rc.width, H = rc.height, s = Math.max(W / sw, H / sh);          // object-fit: cover
  const px = W / 2 + (x - W / 2 - panX) / D, py = H / 2 + (y - H / 2 - panY) / D; // annulla pan e zoom digitale
  poi = {
    x: Math.min(1, Math.max(0, 0.5 + (px - W / 2) / (s * sw))),
    y: Math.min(1, Math.max(0, 0.5 + (py - H / 2) / (s * sh))),
  };
  const adv = { pointsOfInterest: [poi] };
  if (caps.focusMode && caps.focusMode.includes('single-shot')) adv.focusMode = 'single-shot';  // rimette a fuoco subito
  track.applyConstraints({ advanced: [adv] }).then(() => {
    clearTimeout(focusT);
    focusT = setTimeout(() => { applyCons().catch(() => {}); }, 1500);   // poi torna all'autofocus continuo su quel punto
  }).catch(() => {
    if (!focusWarned) { focusWarned = true; toast('Questa camera non permette di scegliere il punto a fuoco'); }
  });
}
stage.addEventListener('pointerup', up);
stage.addEventListener('pointercancel', up);
stage.addEventListener('wheel', e => { e.preventDefault(); setZoom(Z * Math.exp(-e.deltaY / 400)); }, { passive: false });
let hintHidden = false;
function hideHint() { if (!hintHidden) { hintHidden = true; $('#hint').classList.remove('show'); } }

// ---- blocca immagine ----
function setFrozen(on) {
  if (on) {
    const w = video.videoWidth, h = video.videoHeight; if (!w) return;
    frozen.width = w; frozen.height = h;
    frozen.getContext('2d').drawImage(video, 0, 0, w, h);
    hwCur = hw ? ((track.getSettings && track.getSettings().zoom) || zHw) : 1;
    isFrozen = true; frozen.style.display = 'block'; video.style.visibility = 'hidden';
    if (Z < hwCur) Z = hwCur;
  } else {
    isFrozen = false; frozen.style.display = 'none'; video.style.visibility = 'visible';
  }
  bFreeze.setAttribute('aria-pressed', isFrozen);
  bFreeze.querySelector('span').textContent = isFrozen ? 'Riprendi' : 'Blocca';
  bFreeze.querySelector('svg').innerHTML = isFrozen
    ? '<path d="M8 5l11 7-11 7z"/>'
    : '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
  lockb.style.display = isFrozen ? 'flex' : 'none';
  sync();
}
bFreeze.onclick = () => setFrozen(!isFrozen);

// ---- torcia ----
bTorch.onclick = async () => {
  torchOn = !torchOn;
  try { await applyCons(); } catch (e) { torchOn = !torchOn; toast('Luce non disponibile su questa camera'); }
  bTorch.setAttribute('aria-pressed', torchOn);
};

// ---- zona visibile: serve a foto e video ----
function region() {
  const src = isFrozen ? frozen : video;
  const sw = isFrozen ? frozen.width : video.videoWidth, sh = isFrozen ? frozen.height : video.videoHeight;
  if (!sw || !sh) return null;
  const W = stage.clientWidth, H = stage.clientHeight;
  const s = Math.max(W / sw, H / sh) * D;                 // pixel di schermo per pixel sorgente
  const w = W / s, h = H / s;
  return { src, x: sw / 2 - panX / s - w / 2, y: sh / 2 - panY / s - h / 2, w, h, W, H };
}
function paint(ctx, r, ow, oh) {
  ctx.filter = filterString() || 'none';
  ctx.drawImage(r.src, r.x, r.y, r.w, r.h, 0, 0, ow, oh);
  ctx.filter = 'none';
  const t = MODES[mode].t;
  if (t) { ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = t; ctx.fillRect(0, 0, ow, oh); ctx.globalCompositeOperation = 'source-over'; }
}
const stamp = () => 'lente-' + new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
const fmtSize = n => n > 1048576 ? (n / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
const fmtDur = t => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');

// ---- ultimo scatto / video: anteprima, condividi, salva ----
const mediaCard = $('#media'), mThumb = $('#mThumb');
$('#mShare').hidden = !navigator.share;
function setLast(blob, kind, name, extra, thumbUrl) {
  if (last) URL.revokeObjectURL(last.url);
  const url = URL.createObjectURL(blob);
  last = { blob, kind, name, url };
  $('#mImg').src = kind === 'Video' ? thumbUrl : url;
  mThumb.classList.toggle('vid', kind === 'Video');
  $('#mT').textContent = kind;
  $('#mS').textContent = (extra ? extra + ' · ' : '') + fmtSize(blob.size);
  mediaCard.hidden = false;
}
$('#mClose').onclick = () => { mediaCard.hidden = true; };
$('#mSave').onclick = () => {
  if (!last) return;
  const a = document.createElement('a');
  a.href = last.url; a.download = last.name;
  document.body.appendChild(a); a.click(); a.remove();
  toast(last.kind + ' salvato nei download');
};
$('#mShare').onclick = async () => {
  if (!last) return;
  const f = new File([last.blob], last.name, { type: last.blob.type });
  try {
    if (navigator.canShare && navigator.canShare({ files: [f] })) await navigator.share({ files: [f], title: 'Lente' });
    else toast('Condivisione non disponibile: usa Salva');
  } catch (e) { if (e.name !== 'AbortError') toast('Condivisione non riuscita'); }
};
mThumb.onclick = () => {
  if (!last) return;
  const body = $('#pvBody'); body.innerHTML = '';
  const el = document.createElement(last.kind === 'Video' ? 'video' : 'img');
  el.src = last.url;
  if (last.kind === 'Video') { el.controls = true; el.playsInline = true; el.autoplay = true; }
  body.appendChild(el);
  $('#preview').classList.add('open');
};
$('#pvClose').onclick = () => { $('#preview').classList.remove('open'); $('#pvBody').innerHTML = ''; };

// ---- foto ----
bSnap.onclick = () => {
  const r = region(); if (!r) return toast('Nessuna immagine da salvare');
  const out = document.createElement('canvas');
  out.width = Math.round(r.w); out.height = Math.round(r.h);
  paint(out.getContext('2d'), r, out.width, out.height);
  out.toBlob(blob => {
    if (!blob) return toast('Foto non riuscita');
    setLast(blob, 'Foto', stamp() + '.jpg', out.width + '×' + out.height);
  }, 'image/jpeg', 0.93);
};

// ---- video: registra ciò che vedi (zoom, spostamento e filtri compresi) ----
const bVid = $('#bVid'), recb = $('#recb');
function pickMime() {
  const c = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  return c.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
}
function recUI(on) {
  bVid.classList.toggle('rec', on);
  bVid.setAttribute('aria-pressed', on);
  bVid.querySelector('span').textContent = on ? 'Stop' : 'Video';
  bVid.querySelector('svg').innerHTML = on
    ? '<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>'
    : '<rect x="3" y="6.5" width="12" height="11" rx="2.2"/><path d="M15 10.5l6-3.2v9.4l-6-3.2z"/>';
  recb.style.display = on ? 'flex' : 'none';
  if (on) $('#recT').textContent = '0:00';
}
async function startRec() {
  if (recBusy || rec) return;
  if (!track || !window.MediaRecorder) return toast('Registrazione video non supportata da questo browser');
  const r = region(); if (!r) return toast('Fotocamera non pronta');
  recBusy = true;
  const k = 1920 / Math.max(r.W, r.H);                       // lato lungo al massimo 1920 px
  const ow = Math.max(2, Math.round(r.W * k / 2) * 2), oh = Math.max(2, Math.round(r.H * k / 2) * 2);
  const cv = document.createElement('canvas'); cv.width = ow; cv.height = oh;
  const ctx = cv.getContext('2d');
  let mic = null;
  if (audioOn) {
    try { mic = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) { toast('Microfono non disponibile: registro senza audio'); }
  }
  const out = cv.captureStream(30);
  if (mic) mic.getAudioTracks().forEach(t => out.addTrack(t));
  const mime = pickMime();
  let mr;
  try { mr = new MediaRecorder(out, { ...(mime ? { mimeType: mime } : {}), videoBitsPerSecond: 8e6 }); }
  catch (e) { if (mic) mic.getTracks().forEach(t => t.stop()); recBusy = false; return toast('Registrazione video non supportata'); }
  const chunks = [];
  mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  const t0 = performance.now();
  mr.onstop = () => {
    const base = (mr.mimeType || mime || 'video/webm').split(';')[0];
    const blob = new Blob(chunks, { type: base });
    out.getTracks().forEach(t => t.stop());
    if (mic) mic.getTracks().forEach(t => t.stop());
    recBusy = false;
    if (!blob.size) return toast('Video vuoto: riprova');
    setLast(blob, 'Video', stamp() + (base.includes('mp4') ? '.mp4' : '.webm'), fmtDur((performance.now() - t0) / 1000), cv.toDataURL('image/jpeg', 0.6));
  };
  rec = { mr, raf: 0, secs: -1 };
  paint(ctx, r, ow, oh);
  mr.start(1000);
  recUI(true);
  const loop = () => {
    if (!rec) return;
    const rg = region(); if (rg) paint(ctx, rg, ow, oh);
    const sec = Math.floor((performance.now() - t0) / 1000);
    if (sec !== rec.secs) { rec.secs = sec; $('#recT').textContent = fmtDur(sec); }
    rec.raf = requestAnimationFrame(loop);
  };
  loop();
}
function stopRec() {
  if (!rec) return;
  const r = rec; rec = null;
  cancelAnimationFrame(r.raf);
  recUI(false);
  try { r.mr.stop(); } catch (e) { recBusy = false; }
}
bVid.onclick = () => (rec ? stopRec() : startRec());

// ---- fotocamera ----
function stopStream() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; track = null;
}
async function listDevices() {
  try {
    const all = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    const back = all.filter(d => !/front|user|anteriore|selfie/i.test(d.label));
    devices = back.length ? back : all;
  } catch (e) { devices = []; }
}
async function start(deviceId) {
  if (rec) stopRec();
  stopStream(); hideMsg();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return showMsg('Fotocamera non disponibile',
      'Serve una pagina aperta in modo sicuro (https). Apri l’app dall’indirizzo https oppure installala dalla schermata Home.');
  }
  const size = { width: { ideal: 3840 }, height: { ideal: 2160 } };
  const attempts = deviceId
    ? [{ deviceId: { exact: deviceId }, ...size }, { deviceId: { exact: deviceId } }]
    : [{ facingMode: { ideal: 'environment' }, ...size }, { facingMode: { ideal: 'environment' } }, true];
  let err = null;
  for (const v of attempts) {
    try { stream = await navigator.mediaDevices.getUserMedia({ video: v, audio: false }); break; }
    catch (e) { err = e; if (e.name === 'NotAllowedError' || e.name === 'SecurityError') break; }
  }
  if (!stream) {
    const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
    return showMsg(denied ? 'Permesso negato' : 'Fotocamera non trovata',
      denied ? 'Consenti l’accesso alla fotocamera nelle impostazioni del sito (icona del lucchetto), poi riprova.'
             : 'Non riesco ad aprire la fotocamera. Chiudi le altre app che la usano e riprova.');
  }
  track = stream.getVideoTracks()[0];
  video.srcObject = stream;
  try { await video.play(); } catch (e) {}
  track.addEventListener('ended', () => { if (!document.hidden) start(); });

  caps = track.getCapabilities ? track.getCapabilities() : {};
  hw = !!(caps.zoom && caps.zoom.max > caps.zoom.min);
  hwMin = hw ? caps.zoom.min : 1; hwMax = hw ? caps.zoom.max : 1;
  hasTorch = !!caps.torch;
  focusCont = !!(caps.focusMode && caps.focusMode.includes('continuous'));
  torchOn = false; zHw = hwMin; hwCur = hwMin; panX = panY = 0; poi = null;
  bTorch.hidden = !hasTorch; bTorch.setAttribute('aria-pressed', 'false');
  try { await applyCons(); } catch (e) {}

  await listDevices();
  const cur = track.getSettings && track.getSettings().deviceId;
  const i = devices.findIndex(d => d.deviceId === cur);
  devIdx = i >= 0 ? i : 0;
  bCam.hidden = devices.length < 2;

  if (isFrozen) setFrozen(false);
  Z = lo(); sync();
  applyFilter();
}
bCam.onclick = async () => {
  if (devices.length < 2) return;
  devIdx = (devIdx + 1) % devices.length;
  await start(devices[devIdx].deviceId);
  $('#camL').textContent = 'Cam ' + (devIdx + 1);
  toast('Camera ' + (devIdx + 1) + ' di ' + devices.length);
};
$('#retry').onclick = () => start();

// ---- schermo sempre acceso ----
let wl = null;
async function keepAwake() { try { wl = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (rec) stopRec(); return; }
  keepAwake();
  if (!track || track.readyState === 'ended') start();
  else video.play().catch(() => {});
});

// ridimensionamento (apertura/chiusura del Fold)
let rz;
new ResizeObserver(() => { clearTimeout(rz); rz = setTimeout(sync, 60); }).observe(stage);

// ---- avvio ----
applyFilter(); sync();
$('#hint').classList.add('show'); setTimeout(hideHint, 5000);
start(); keepAwake();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
// ---- installazione come app ----
let installEv = null;
const bInstall = $('#bInstall');
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installEv = e;
  if (!standalone()) bInstall.hidden = false;
});
bInstall.onclick = async () => {
  if (!installEv) return;
  installEv.prompt();
  try { await installEv.userChoice; } catch (e) {}
  installEv = null; bInstall.hidden = true;
};
window.addEventListener('appinstalled', () => { bInstall.hidden = true; toast('App installata'); });
// per i test
window.__lente = { get state() { return { Z, D, hw, hwMin, hwMax, isFrozen, mode, panX, panY, poi }; } };
})();
</script>
